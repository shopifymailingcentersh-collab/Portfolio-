<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire a Primal Lux Expert</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:#FCFCF8; color:#1A2A2A; line-height:1.5; }
        :root { --charcoal:#1E2F2F; --forest:#0F3B2C; --gold:#D4AF37; --border-light:#E8EBE4; --gray-bg:#F5F6F2; }
        .container { max-width:1280px; margin:0 auto; padding:0 2rem; }
        .navbar { display:flex; justify-content:space-between; align-items:center; padding:1.2rem 0; flex-wrap:wrap; gap:1rem; border-bottom:1px solid var(--border-light); }
        .logo { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg, var(--forest), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
        .nav-links { display:flex; gap:2rem; flex-wrap:wrap; }
        .nav-links a { color:var(--charcoal); text-decoration:none; font-weight:500; transition:0.2s; }
        .nav-links a:hover { color:var(--gold); }
        .btn-primary, .btn-outline, .btn-gold { display:inline-block; padding:0.8rem 1.8rem; border-radius:40px; font-weight:600; text-decoration:none; transition:0.2s; font-size:0.9rem; border:none; cursor:pointer; }
        .btn-primary { background:var(--forest); color:white; }
        .btn-primary:hover { background:#1C553F; transform:translateY(-2px); }
        .btn-gold { background:var(--gold); color:var(--charcoal); }
        .btn-gold:hover { background:#C29E2E; transform:translateY(-2px); }
        .section-title { font-size:2rem; font-weight:700; margin-bottom:1rem; color:var(--charcoal); position:relative; }
        .section-title:after { content:''; position:absolute; bottom:-12px; left:0; width:70px; height:3px; background:var(--gold); }
        .developer-header { background:linear-gradient(135deg, var(--forest), #1C553F); color:white; border-radius:32px; padding:2rem; margin:2rem 0; text-align:center; }
        .developer-header h2 { font-size:2.2rem; margin-bottom:0.5rem; }
        .services-grid, .pricing-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:2rem; margin:2rem 0; }
        .service-card, .pricing-card { background:white; border-radius:28px; padding:1.8rem; border:1px solid var(--border-light); transition:0.2s; }
        .service-card i, .pricing-card i { font-size:2rem; color:var(--gold); margin-bottom:1rem; }
        .pricing-card .price { font-size:2rem; font-weight:800; color:var(--forest); margin:0.5rem 0; }
        .pricing-card ul { margin:1rem 0; list-style:none; }
        .pricing-card li { margin:0.5rem 0; font-size:0.85rem; display:flex; align-items:center; gap:8px; }
        .pricing-card li i { font-size:0.8rem; color:var(--gold); margin-bottom:0; }
        .custom-package { background:var(--gray-bg); border-radius:32px; padding:2rem; margin:2rem 0; }
        .custom-package textarea, .custom-package input { width:100%; padding:1rem; margin-bottom:1rem; border:1px solid var(--border-light); border-radius:20px; font-family:inherit; }
        .contact-buttons { display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; margin:2rem 0; }
        .contact-btn { display:inline-flex; align-items:center; gap:8px; padding:0.8rem 1.5rem; border-radius:40px; font-weight:600; text-decoration:none; background:var(--forest); color:white; transition:0.2s; }
        .contact-btn.whatsapp { background:#25D366; }
        .contact-btn.email { background:#2C3E50; }
        .contact-btn.calendly { background:var(--gold); color:var(--charcoal); }
        .contact-btn:hover { transform:translateY(-2px); filter:brightness(1.05); }
        footer { padding:2.5rem 0; text-align:center; color:#6B7B7B; font-size:0.8rem; margin-top:2rem; }
        @media (max-width:780px) { .container { padding:0 1.2rem; } .navbar { flex-direction:column; align-items:flex-start; } }
    </style>
</head>
<body>
<div class="container">
    <nav class="navbar">
        <a href="index.html" class="logo">PRIMAL LUX</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="work.html">Work</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</div>

<div class="container" id="hireContent">
    <!-- Dynamic content will be injected here -->
</div>

<footer>
    <div class="container">
        <div class="logo" style="font-size:1.5rem; margin-bottom:0.5rem;">PRIMAL LUX</div>
        <div>Built for brands that want more than just a “nice-looking” store.</div>
        <p>© 2026 Primal Lux. All Rights Reserved.</p>
    </div>
</footer>

<script>
    // ======================== DEVELOPER DATABASE ========================
    // Each developer has: name, role, tagline, uniqueServices (array of 6+ problems), uniquePricing (array of packages)
    const developers = {
        "Adenike O.": {
            role: "Lead Conversion Specialist",
            tagline: "I fix hidden revenue leaks & turn browsers into buyers.",
            services: [
                "🚀 Low conversion rates – psychology‑driven CRO & A/B testing",
                "📉 High cart abandonment – urgency triggers & checkout flow fixes",
                "📱 Mobile checkout friction – responsive fixes & one‑tap payments",
                "🔍 Poor product discovery – search & filtering optimization",
                "💰 Weak upsell/cross‑sell – post‑purchase & cart add‑ons",
                "📊 Untracked analytics – GA4, Hotjar, Clarity setup"
            ],
            pricing: [
                { name: "Quick CRO Fix", price: 150, features: ["Single page conversion audit", "1 urgent fix", "24h delivery"] },
                { name: "Growth Bundle", price: 500, features: ["Full product page optimization", "Abandoned cart setup", "Mobile responsiveness"] },
                { name: "Checkout Rebuild", price: 1200, features: ["Complete checkout psychology redesign", "Trust badges & urgency", "A/B test plan"] },
                { name: "Advanced CRO Suite", price: 2500, features: ["Full funnel audit + implementation", "Heatmap & session replay analysis", "3 months of ongoing CRO"] },
                { name: "Enterprise Conversion", price: 4000, features: ["End‑to‑end conversion program", "Custom dashboard & reporting", "Dedicated strategist"] }
            ]
        },
        "Vas Horland": {
            role: "Creative Director & Team Lead",
            tagline: "I build premium brand identities that feel expensive before the price tag.",
            services: [
                "🎨 Generic brand perception – full luxury rebranding",
                "🖼️ Inconsistent visual language – design systems & guidelines",
                "📸 Low‑quality product presentation – premium photography direction",
                "🧩 Weak storytelling – brand narrative & positioning",
                "🏷️ Poor high‑ticket presentation – exclusivity & trust design",
                "🎭 Unclear differentiation – competitor brand gap analysis"
            ],
            pricing: [
                { name: "Brand Foundation", price: 400, features: ["Logo + color palette", "Basic brand guidelines", "Font system"] },
                { name: "Visual Identity Boost", price: 900, features: ["Complete brand identity kit", "Social media templates", "Presentation deck"] },
                { name: "Luxury Brand System", price: 1800, features: ["Full visual identity", "Packaging mockups", "Brand strategy document"] },
                { name: "Creative Direction", price: 2800, features: ["Full rebrand + art direction", "Campaign assets", "Launch strategy"] },
                { name: "White‑Glove Suite", price: 4500, features: ["Complete brand ecosystem", "Ongoing creative retainer", "VIP support"] }
            ]
        },
        "Oliver King": {
            role: "Lead Store Designer & Developer",
            tagline: "I build high‑converting Shopify stores that are fast, beautiful, and custom.",
            services: [
                "💻 Slow page speed – performance optimization & core web vitals",
                "🎨 Outdated theme design – custom liquid & section development",
                "🛠️ Broken integrations – app configurations & API fixes",
                "📦 Complex product customization – variant options & bundles",
                "🔐 Security & backup issues – store hardening & recovery plans",
                "🌐 Multi‑language/currency – international store setup"
            ],
            pricing: [
                { name: "Quick Fix", price: 150, features: ["Single bug/issue fix", "Minor CSS/JS adjustment", "2h response"] },
                { name: "Theme Overhaul", price: 800, features: ["Custom section development", "Speed optimization", "Mobile refinement"] },
                { name: "Full Store Build (Basic)", price: 2200, features: ["Custom Shopify theme", "Up to 10 products", "Basic SEO setup"] },
                { name: "Advanced Store Dev", price: 3800, features: ["Fully custom store", "Unlimited products", "App integrations", "Ongoing support"] },
                { name: "Enterprise Platform", price: 5500, features: ["Headless or custom checkout", "ERP/CRM integration", "Dedicated developer"] }
            ]
        },
        "Abolade Bayonle": {
            role: "QA & Optimization Specialist",
            tagline: "I find the silent bugs and speed killers that cost you sales.",
            services: [
                "🐛 Hidden frontend bugs – cross‑browser & device testing",
                "⏱️ Slow load times – image compression & caching strategies",
                "📉 Poor Lighthouse scores – technical SEO & accessibility fixes",
                "🔄 Broken checkout flows – order processing errors",
                "📧 Email deliverability issues – Klaviyo/Omnisend setup",
                "🛡️ Security vulnerabilities – PCI compliance & SSL checks"
            ],
            pricing: [
                { name: "Site Audit", price: 200, features: ["Full performance report", "Top 5 issues fixed", "Lighthouse score improvement"] },
                { name: "Bug Hunt", price: 450, features: ["Comprehensive QA testing", "Unlimited bug fixes (1 week)", "Compatibility report"] },
                { name: "Speed Surge", price: 850, features: ["Aggressive speed optimization", "Core Web Vitals pass", "Ongoing monitoring"] },
                { name: "Full Technical Overhaul", price: 1900, features: ["Complete QA + speed + security", "CI/CD testing setup", "Monthly retainer option"] },
                { name: "Enterprise Assurance", price: 3500, features: ["Dedicated QA engineer", "Automated testing pipeline", "24/7 monitoring"] }
            ]
        },
        "Daniel Reeves": {
            role: "Conversion Optimization Specialist",
            tagline: "I turn data into decisions – more revenue from the same traffic.",
            services: [
                "📊 No clear conversion data – analytics setup & event tracking",
                "🧪 Untested pages – A/B testing & experiment design",
                "🔄 Leaky funnels – funnel analysis & drop‑off fixes",
                "💳 Payment hesitation – trust signals & payment method optimization",
                "📈 Low AOV – post‑purchase upsell & bundle strategies",
                "📉 High bounce rate – engagement & scroll depth optimization"
            ],
            pricing: [
                { name: "Data Setup", price: 180, features: ["GA4 + GTM implementation", "Ecommerce tracking", "Custom dashboard"] },
                { name: "Single Funnel Fix", price: 500, features: ["Analyze one funnel (checkout/cart)", "Implement 2 changes", "Before/after report"] },
                { name: "CRO Intensive", price: 1500, features: ["Full funnel audit", "3 A/B test ideas", "Implementation of top fixes"] },
                { name: "Revenue Program", price: 2800, features: ["Quarterly CRO partnership", "Unlimited A/B tests", "Weekly insights"] },
                { name: "Enterprise CRO", price: 4500, features: ["Dedicated CRO team", "Predictive analytics", "Revenue share option"] }
            ]
        },
        "Ethan Cole": {
            role: "Brand Identity Strategist",
            tagline: "I craft premium brand systems that command higher prices.",
            services: [
                "🏷️ Cheap brand perception – premium positioning & tone of voice",
                "📄 Inconsistent messaging – copy & visual alignment",
                "🎯 Wrong audience targeting – buyer persona & value prop",
                "📚 No brand guidelines – full identity system creation",
                "🏆 Weak authority – trust signals & social proof architecture",
                "🔄 Scaling issues – brand architecture for multiple sub‑brands"
            ],
            pricing: [
                { name: "Brand Spark", price: 250, features: ["Brand messaging worksheet", "Mood board", "Competitor audit"] },
                { name: "Identity Kit", price: 750, features: ["Logo suite + color palette", "Typography system", "Basic guideline deck"] },
                { name: "Premium Brand World", price: 1700, features: ["Complete brand identity", "Voice & tone guide", "Launch assets"] },
                { name: "Luxury Positioning", price: 3000, features: ["Full repositioning strategy", "High‑ticket presentation", "Investor deck"] },
                { name: "Brand as a Service", price: 5000, features: ["Ongoing brand direction", "Quarterly refresh", "Unlimited assets"] }
            ]
        }
    };

    // Helper: get developer from URL, fallback to first
    const urlParams = new URLSearchParams(window.location.search);
    let devName = urlParams.get('developer');
    if (!devName || !developers[devName]) {
        devName = "Adenike O."; // default
    }

    const dev = developers[devName];

    // Build the HTML
    const container = document.getElementById('hireContent');
    container.innerHTML = `
        <div class="developer-header">
            <h2>${devName}</h2>
            <p><strong>${dev.role}</strong> <i class="fas fa-star" style="color:var(--gold);"></i></p>
            <p>${dev.tagline}</p>
        </div>

        <h2 class="section-title">🔧 Shopify problems ${devName} solves</h2>
        <div class="services-grid">
            ${dev.services.map(s => `<div class="service-card"><i class="fas fa-bug"></i><h3>${s.split('–')[0]}</h3><p>${s.split('–')[1] || s}</p></div>`).join('')}
        </div>

        <h2 class="section-title">💰 Investment plans (${devName})</h2>
        <div class="pricing-grid">
            ${dev.pricing.map(p => `
                <div class="pricing-card">
                    <i class="fas fa-tag"></i>
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price} USD</div>
                    <ul>${p.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}</ul>
                </div>
            `).join('')}
        </div>

        <div class="custom-package">
            <h3 style="font-size:1.6rem; margin-bottom:1rem;">✨ Custom package – Tell me what you need</h3>
            <p style="margin-bottom:1rem;">Not seeing exactly what you're looking for? Describe your project and I'll tailor a price & plan.</p>
            <textarea id="customRequest" rows="4" placeholder="Example: I need a complete Shopify migration, custom loyalty app, and subscription integration..."></textarea>
            <input type="text" id="customBudget" placeholder="Your estimated budget (optional)">
            <button id="customQuoteBtn" class="btn-gold">Request custom quote →</button>
            <div id="customFeedback" style="margin-top:1rem; font-size:0.85rem; color:var(--forest);"></div>
        </div>

        <div style="text-align:center; margin:3rem 0 1rem;">
            <h2 class="section-title" style="display:inline-block;">📞 Ready to hire ${devName}?</h2>
        </div>
        <div class="contact-buttons" id="contactButtons"></div>
        <p style="text-align:center; font-size:0.8rem; color:#6D8484;">Choose any method – expect a reply within 2 hours.</p>
    `;

    // Contact buttons with prefilled message
    const message = `Hi ${devName}, I'm interested in hiring you. I saw your profile on Primal Lux and would love to discuss a project.`;
    const encodedMsg = encodeURIComponent(message);
    const emailSubject = encodeURIComponent(`Hire request for ${devName}`);
    const emailBody = encodeURIComponent(message + "\n\nMy project details: ");

    const contactDiv = document.getElementById('contactButtons');
    contactDiv.innerHTML = `
        <a href="https://wa.me/?text=${encodedMsg}" target="_blank" class="contact-btn whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="mailto:primaluxecommerce@gmail.com?subject=${emailSubject}&body=${emailBody}" class="contact-btn email"><i class="fas fa-envelope"></i> Email</a>
        <a href="https://calendly.com/oliverkingdev/30min" target="_blank" class="contact-btn calendly"><i class="fas fa-calendar-check"></i> Schedule a call</a>
    `;

    // Custom quote button
    const quoteBtn = document.getElementById('customQuoteBtn');
    const customFeedback = document.getElementById('customFeedback');
    quoteBtn.addEventListener('click', () => {
        const request = document.getElementById('customRequest').value.trim();
        const budget = document.getElementById('customBudget').value.trim();
        if (!request) {
            customFeedback.innerHTML = "⚠️ Please describe your project needs first.";
            customFeedback.style.color = "#B84C2C";
            return;
        }
        const subject = `Custom project request for ${devName}`;
        const body = `Developer: ${devName}\n\nProject description:\n${request}\n\nBudget (if provided): ${budget || "Not specified"}\n\nPlease provide a tailored quote.`;
        window.location.href = `mailto:primaluxecommerce@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        customFeedback.innerHTML = "✨ Redirecting to email... Feel free to add more details before sending!";
        customFeedback.style.color = "var(--forest)";
    });
</script>
</body>
</html>
